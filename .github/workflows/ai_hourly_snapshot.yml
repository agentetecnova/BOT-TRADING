name: AI Hourly BTCUSDT Snapshot

on:
  schedule:
    # Runs every 1 hour automatically (zero Vercel builds triggered)
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ai-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ai_engine/requirements.txt"

      - name: Install AI Engine dependencies
        run: pip install -r ai_engine/requirements.txt

      - name: Load latest weekly-trained model if present on ai-snapshot branch
        run: |
          mkdir -p /tmp/ai_out
          if curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/ai-snapshot/btc_ai_models.joblib" -o /tmp/ai_out/btc_ai_models.joblib; then
            echo "Using latest weekly retrained model from ai-snapshot branch"
            MODEL_ARG="/tmp/ai_out/btc_ai_models.joblib"
          else
            echo "Using baseline model from main"
            cp ai_engine/artifacts/btc_ai_models.joblib /tmp/ai_out/btc_ai_models.joblib
            MODEL_ARG="ai_engine/artifacts/btc_ai_models.joblib"
          fi
          python -m ai_engine.predict --model "$MODEL_ARG" --output /tmp/ai_out/ai_oracle_snapshot.json

      - name: Publish lightweight snapshot to isolated ai-snapshot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ai-snapshot-temp
          git rm -rf --cached . > /dev/null 2>&1 || true
          find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +
          cp /tmp/ai_out/ai_oracle_snapshot.json ai_oracle_snapshot.json
          cp /tmp/ai_out/btc_ai_models.joblib btc_ai_models.joblib
          python -c 'import json; open("vercel.json","w").write(json.dumps({"git":{"deploymentEnabled":{"ai-snapshot":False}},"ignoreCommand":"exit 0"}, indent=2))'
          git add ai_oracle_snapshot.json btc_ai_models.joblib vercel.json
          git commit -m "chore(ai): hourly BTCUSDT snapshot [skip ci]"
          git push --force origin ai-snapshot-temp:ai-snapshot
